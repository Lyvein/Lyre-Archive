<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<title>Lyvein</title>

				<link rel="preconnect" href="https://fonts.googleapis.com">
					<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
						<link
							href="https://fonts.googleapis.com/css2?family=Federo&family=Saira+Extra+Condensed:wght@400;600&display=swap"
							rel="stylesheet"
>

							<link rel="stylesheet" href="style.css">
</head>

	<body class="nodal_hub-page">

		<nav>
			<a href="index.html">Home</a>
			<a href="nodal_hub.html">Lyvein</a>
		</nav>

		<div class="loader" id="loader">
			<img class="loader-gif" src="images/Loading.GIF" alt="Loading">
	</div>

		<div class="sparks-layer" id="sparks"></div>
		<div class="transition-panel" id="transition-panel"></div>


		<main class="lyvein-hub">

			<div class="lyvein-kv" aria-label="Lyvein">


				<svg class="node-network"
					 viewBox="0 0 100 100"
					 preserveAspectRatio="none"
					 aria-hidden="true">

					<!-- 01 → 02 -->
					<line x1="19" y1="31" x2="77" y2="24" />

					<!-- 01 → 03 -->
					<line x1="19" y1="31" x2="34" y2="48" />

					<!-- 03 → 06 -->
					<line x1="34" y1="48" x2="66" y2="59" />

					<!-- 06 → 02 -->
					<line x1="66" y1="59" x2="77" y2="24" />

					<!-- 03 → 04 -->
					<line x1="34" y1="48" x2="27" y2="76" />

					<!-- 06 → 05 -->
					<line x1="66" y1="59" x2="87" y2="49" />

				</svg>
				
				<!-- 01 — Modern -->
				<a class="lyvein-node node-modern" href="#" aria-label="Modern">
					<span class="node-number">01</span>
					<span class="node-dot"></span>
					<span class="node-label">Modern</span>
				</a>

				<!-- 02 — Fantasy -->
				<a class="lyvein-node node-fantasy" href="#" aria-label="Fantasy">
					<span class="node-number">02</span>
					<span class="node-dot"></span>
					<span class="node-label">Fantasy</span>
				</a>

				<!-- 03 — Northern -->
				<a class="lyvein-node node-northern" href="#" aria-label="Northern">
					<span class="node-number">03</span>
					<span class="node-dot"></span>
					<span class="node-label">Northern</span>
				</a>

				<!-- 04 — Unknown -->
				<a class="lyvein-node node-unknown" href="#" aria-label="Unknown">
					<span class="node-number">04</span>
					<span class="node-dot"></span>
					<span class="node-label">???</span>
				</a>

				<!-- 05 — ... -->
				<a class="lyvein-node node-ellipsis" href="#" aria-label="More">
					<span class="node-number">05</span>
					<span class="node-dot"></span>
					<span class="node-label">...</span>
				</a>

				<!-- 06 — ... -->
				<a class="lyvein-node node-magic" href="#" aria-label="magic">
					<span class="node-number">06</span>
					<span class="node-dot"></span>
					<span class="node-label">Magic</span>
				</a>

			</div>

		</main>

		<script src="script.js"></script>

	</body>
</html>
